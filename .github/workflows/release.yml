# On every push to main: test, build and sign to check that everything works.
# On a release — pushing a vX.Y.Z tag, or running this workflow from the Actions tab with a version —
# also notarize, create the GitHub release and update the cask in hyppe-cc/homebrew-tap.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    # Liquid Glass needs the macOS 26 SDK.
    runs-on: macos-26
    env:
      HAS_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
      # Set on a release: from the tag, or from the version typed in the Actions tab.
      VERSION: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check version
        if: env.VERSION != ''
        run: |
          VERSION="${VERSION#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Not a version: $VERSION" >&2; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Toolchain
        run: swift --version

      - name: Test
        run: swift test

      # The runner has no keychain entry: import the Developer ID certificate
      # into a temporary keychain for this job, then delete the file.
      - name: Import Apple certificate
        if: env.HAS_CERTIFICATE == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/certificate.p12"

      # Signs with Developer ID when the certificate is available; notarizes only on release tags.
      - name: Build
        env:
          SIGN_IDENTITY: "${{ env.HAS_CERTIFICATE == 'true' && 'Developer ID Application: FERMIN GUADALUPE VILLANUEVA SALAS (4L3BNUJJZJ)' || '' }}"
          APPLE_ID: ${{ env.VERSION != '' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ env.VERSION != '' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: 4L3BNUJJZJ
        run: scripts/build.sh

      # Creates the vX.Y.Z tag on this commit too when the release was started from the Actions tab.
      - name: Create release
        if: env.VERSION != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" build/Tunnels.zip --target "$GITHUB_SHA" \
            --title "Tunnels $VERSION" --generate-notes

      - name: Update cask in the tap
        if: env.VERSION != ''
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          SHA=$(shasum -a 256 build/Tunnels.zip | cut -d' ' -f1)

          mkdir -p ~/.ssh
          echo "$TAP_DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o StrictHostKeyChecking=accept-new"

          git clone git@github.com:hyppe-cc/homebrew-tap.git tap
          cd tap
          mkdir -p Casks
          # The cask template lives in this repo, so changes to it ship with the release.
          sed -E "s/^  version \".*\"/  version \"$VERSION\"/; s/^  sha256 \".*\"/  sha256 \"$SHA\"/" \
            ../packaging/tunnels.rb > Casks/tunnels.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/tunnels.rb
          git commit -m "tunnels $VERSION"
          git push

