name: Release

# Bump the version in ./VERSION and push to main: a release tagged v<version> is built and
# published automatically (scripts/release.sh X.Y.Z does the bump). The tag and release are
# created with GITHUB_TOKEN, so they belong to github-actions[bot].
#
# Every other push and pull request just tests and builds. Signing, notarizing and the Homebrew
# cask update each run when their secrets are set and are skipped otherwise.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    # Liquid Glass needs the macOS 26 SDK.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      # Which secrets are usable. Prints lengths only, never values, to make empty ones obvious.
      - name: Check secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD TAP_DEPLOY_KEY; do
            value="${!name}"
            echo "$name: ${#value} characters"
          done
          flag() { [[ -n "$1" ]] && echo true || echo false; }
          echo "HAS_CERTIFICATE=$(flag "$APPLE_CERTIFICATE")" >> "$GITHUB_ENV"
          echo "HAS_TAP_KEY=$(flag "$TAP_DEPLOY_KEY")" >> "$GITHUB_ENV"

      # RELEASE=true when this is main and v<VERSION> hasn't been released yet.
      - name: Check version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::VERSION must be X.Y.Z, got '$VERSION'"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" != refs/heads/main || "$GITHUB_EVENT_NAME" == pull_request ]]; then
            echo "RELEASE=false" >> "$GITHUB_ENV"
          elif gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$VERSION is already released; bump VERSION to release again."
            echo "RELEASE=false" >> "$GITHUB_ENV"
          else
            echo "Releasing v$VERSION"
            echo "RELEASE=true" >> "$GITHUB_ENV"
          fi

      - name: Toolchain
        run: swift --version

      - name: Test
        run: swift test

      # The runner has no keychain entry: import the Developer ID certificate
      # into a temporary keychain for this job, then delete the file.
      - name: Import Apple certificate
        if: env.HAS_CERTIFICATE == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/certificate.p12"

      # Signs with Developer ID when the certificate is available; notarizes only releases.
      - name: Build
        env:
          SIGN_IDENTITY: "${{ env.HAS_CERTIFICATE == 'true' && 'Developer ID Application: FERMIN GUADALUPE VILLANUEVA SALAS (4L3BNUJJZJ)' || '' }}"
          APPLE_ID: ${{ env.RELEASE == 'true' && env.HAS_CERTIFICATE == 'true' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ env.RELEASE == 'true' && env.HAS_CERTIFICATE == 'true' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: 4L3BNUJJZJ
        run: |
          if [[ "$RELEASE" == true && "$HAS_CERTIFICATE" != true ]]; then
            echo "::warning::No APPLE_CERTIFICATE secret: this release is ad-hoc signed and Gatekeeper will warn on first launch."
          fi
          scripts/build.sh

      - name: Create release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" build/Tunnels.zip --target "$GITHUB_SHA" \
            --title "Tunnels $VERSION" --generate-notes

      - name: Update cask in the tap
        if: env.RELEASE == 'true'
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          if [[ "$HAS_TAP_KEY" != true ]]; then
            echo "::warning::No TAP_DEPLOY_KEY secret: hyppe-cc/homebrew-tap was not updated."
            exit 0
          fi
          SHA=$(shasum -a 256 build/Tunnels.zip | cut -d' ' -f1)

          mkdir -p ~/.ssh
          echo "$TAP_DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o StrictHostKeyChecking=accept-new"

          git clone git@github.com:hyppe-cc/homebrew-tap.git tap
          cd tap
          mkdir -p Casks
          # The cask template lives in this repo, so changes to it ship with the release.
          sed -E "s/^  version \".*\"/  version \"$VERSION\"/; s/^  sha256 \".*\"/  sha256 \"$SHA\"/" \
            ../packaging/tunnels.rb > Casks/tunnels.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/tunnels.rb
          git commit -m "tunnels $VERSION"
          git push
