tunnel: 11111111-1111-4111-8111-111111111111
credentials-file: /tmp/tunnel-fixtures/11111111-1111-4111-8111-111111111111.json

ingress:
  - hostname: blog.example.com
    # Addressed by hostname so the Host header is the local name the web server routes on.
    service: https://blog.test
    originRequest:
      httpHostHeader: blog.test
      originServerName: blog.test
      noTLSVerify: true
  - service: http_status:404
